[workspace]
members = [".", "deku_generic_macros", "no_std_check"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ferngari95/deku_generic"

[package]
name = "deku_generic"
# Not ready for crates.io yet; remove this line to allow `cargo publish`.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Implement deku's read/write traits for concrete instantiations of a generic struct (typestate-friendly, no_std + alloc)"
readme = "README.md"
documentation = "https://docs.rs/deku_generic"
keywords = ["deku", "typestate", "serialization", "binary", "no-std"]
categories = ["encoding", "parsing", "no-std"]
include = [
    "src/**",
    "tests/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
# Exact version: the two crates are released in lock step.
deku_generic_macros = { version = "=0.1.0", path = "deku_generic_macros" }
# Re-exported for the generated code, so the impls and the traits they
# implement come from the same deku version whatever the user's own deku
# dependency looks like. Features stay minimal; the user's deku dependency
# adds `std` or `bits` as needed and Cargo unifies them.
deku = { version = "0.20", default-features = false, features = ["alloc"] }

[dev-dependencies]
deku = "0.20"
trybuild = "1.0"

[lints]
workspace = true

# warn rather than deny. CI passes -D warnings anyway, and a newer toolchain
# that grows a lint shouldn't break people building this from git.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
redundant_imports = "warn"
unit_bindings = "warn"
let_underscore_drop = "warn"
explicit_outlives_requirements = "warn"
meta_variable_misuse = "warn"
macro_use_extern_crate = "warn"
non_ascii_idents = "warn"
keyword_idents_2024 = "warn"
unnameable_types = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# syn 2 and 3 both end up in the tree through deku's own dependencies.
multiple_crate_versions = "allow"
# A panic inside a proc macro is a compiler error without a span.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
unreachable = "warn"
indexing_slicing = "warn"
string_slice = "warn"
# Proc macros must not write to stdout/stderr.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"
str_to_string = "warn"
format_push_string = "warn"
unused_trait_names = "warn"
iter_over_hash_type = "warn"
infinite_loop = "warn"
renamed_function_params = "warn"
redundant_type_annotations = "warn"
unnecessary_safety_doc = "warn"
non_ascii_literal = "warn"
# expect instead of allow: it needs a reason, and it errors once the lint
# it was written for no longer fires.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.lints.rustdoc]
unescaped_backticks = "warn"
private_doc_tests = "warn"
missing_crate_level_docs = "warn"
redundant_explicit_links = "warn"
bare_urls = "warn"
