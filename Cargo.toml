[workspace]
members = [".", "deku_generic_macros", "no_std_check"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ferngari95/deku_generic"

[package]
name = "deku_generic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Implement deku's read/write traits for concrete instantiations of a generic struct (typestate-friendly, no_std + alloc)"
readme = "README.md"
documentation = "https://docs.rs/deku_generic"
keywords = ["deku", "typestate", "serialization", "binary", "no-std"]
categories = ["encoding", "parsing", "no-std"]
include = [
    "src/**",
    "tests/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
# Exact version: the two crates are released in lock step.
deku_generic_macros = { version = "=0.1.0", path = "deku_generic_macros" }

[dev-dependencies]
deku = "0.20"
